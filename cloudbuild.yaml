steps:
  - id: "fetch-data"
    name: "python:3.8-slim"
    entrypoint: "python"
    args:
      - "-c"
      - |
        import requests
        import csv
        def fetch_google_sheet_csv(url):
          response = requests.get(url)
          if response.status_code == 200:
            return response.text
          else:
            return None

        url = "https://docs.google.com/spreadsheets/d/1RsR8JOt8fcKIAbuv6ParmYTfSsUHwk3mEhVt0encK6g/pub?gid=1955807116&single=true&output=csv"
        data = fetch_google_sheet_csv(url)
        with open('service/data.csv', 'w') as file:
          file.write(data)
  - id: "build image"
    name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/${PROJECT_ID}/${_SERVICE_NAME}",
        "${_SERVICE_FOLDER}",
      ]

  - id: "push image"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/${PROJECT_ID}/${_SERVICE_NAME}"]

substitutions:
  _SERVICE_FOLDER: service
  _SERVICE_NAME: nfa-tracker

images:
  - "gcr.io/${PROJECT_ID}/${_SERVICE_NAME}"

options:
  logging: CLOUD_LOGGING_ONLY
